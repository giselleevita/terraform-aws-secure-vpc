version: 2
updates:
  - package-ecosystem: terraform
    directory: /
    schedule:
      interval: monthly
    groups:
      terraform-minor:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: terraform
    directory: /examples/basic
    schedule:
      interval: monthly
    groups:
      terraform-minor:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions-minor:
        patterns: ["*"]
        update-types: ["minor", "patch"]
